; Configuração do Presence Guard
; Fica em ~/.config/presence-guard/config.ini
; Depois de mudar algo, reinicie:  systemctl --user restart presence-guard

[camera]
; auto = usa a mesma câmera do Howdy (infravermelho, funciona no escuro).
; Para forçar outra, coloque o caminho, ex.: /dev/video2
dispositivo = auto

[tempos]
; segundos sem olhar para a tela até borrar
borrar_apos = 2.5
; segundos sem você na frente até bloquear (a tela fica borrada até lá)
bloquear_apos = 60
; se OUTRA pessoa estiver no seu lugar (precisa do cadastrar), bloqueia mais rápido
bloquear_estranho_apos = 15
; olhos fechados por esse tempo contam como "não está olhando" (0 = desliga)
olhos_fechados_apos = 4
; depois de desbloquear, espera esse tempo antes de vigiar de novo
carencia_apos_desbloquear = 5

[olhar]
; folga, em graus, além do que foi medido na calibração
; (aumente se ele borrar quando você está olhando; diminua para ficar mais rígido)
margem_cabeca = 8
; também usa para onde os olhos apontam, não só a cabeça
usar_direcao_dos_olhos = sim
margem_olhos = 0.15
; de óculos o infravermelho reflete nas lentes; aí ele usa só a cabeça
ignorar_olhos_com_oculos = sim

[reconhecimento]
; só vale depois de rodar: presence-guard cadastrar
usar = sim
; semelhança mínima para ser você (0 a 1). Abaixe se ele não te reconhecer
limite_dono = 0.40
; abaixo disso é outra pessoa (no meio do caminho ele não pune ninguém)
limite_estranho = 0.25
; logo depois que você desbloqueia (Howdy/senha), guarda uma amostra nova do seu
; rosto se ele não tinha te reconhecido direito (óculos novos, barba, luz diferente)
aprender_sozinho = sim

[borrao]
; quanto borra quando você só desvia/vira o rosto: leve | medio | forte
; (leve: dá para ver as janelas, mas não dá para ler nada)
virou_o_rosto = leve
; quanto borra quando outra pessoa olha junto com você (precisa de outra_pessoa = borrar)
outra_pessoa_olhando = medio
; quando você sai, o borrão é forte e vai escurecendo aos poucos até bloquear
; (uma "contagem" sem números na tela). nao = forte o tempo todo
escurecer_ate_bloquear = sim

[atividade]
; mexendo no teclado ou no mouse conta como "está aqui e olhando" (ex.: olhando o teclado
; enquanto digita, ou encostado para trás fora da câmera). Mexer o mouse tira o borrão leve.
; Outra pessoa no seu lugar continua sendo borrada mesmo digitando.
considerar_teclado_e_mouse = sim
segundos_de_atividade = 3

[privacidade]
; quando aparece outra pessoa olhando a sua tela junto com você: desligado | avisar | borrar
outra_pessoa = avisar

[energia]
; análises por segundo com você olhando normalmente
analises_por_segundo = 1.5
; análises por segundo quando algo mudou (desviou o olhar, saiu, tela borrada)
analises_por_segundo_alerta = 4
; na bateria faz metade das análises
economia_na_bateria = sim

[recursos]
bloquear = sim
borrar = sim
; não borra enquanto um vídeo ou chamada está tocando (o bloqueio continua valendo)
pausar_borrao_em_videos = sim
; com a tela bloqueada, quando você volta ele já chama o Howdy sozinho
; (você não precisa apertar nada; a câmera IR fica ligada enquanto bloqueado)
desbloqueio_ao_chegar = nao
notificacoes = sim
